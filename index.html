<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Spaghetti</title>
    <meta name="description" content="Our 3D printing notebook: ideas, builds and every attempt, good or spaghetti." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f1e8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Spaghetti" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The two faces every first screen draws (body text and headings, Latin), fetched with the page rather than once the styles are applied, so launching the app doesn't flash a fallback font and shift. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource-variable/figtree/files/figtree-latin-wght-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/src/client/assets/fonts/fraunces-latin-soft-pinned.woff2" />
    <!-- Sets the theme before the first paint, so a dark night never opens on a white flash. Keep in step with src/client/lib/theme.ts. -->
    <script>
      (() => {
        try {
          const choice = localStorage.getItem("sg-theme");
          const dark = choice === "dark" || (choice !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          if (dark) {
            document.querySelector('meta[name="theme-color"]').content = "#1b1714";
            document.querySelector('link[rel="manifest"]').href = "/manifest-dark.webmanifest";
          }
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
