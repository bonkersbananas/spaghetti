name: Rust slicer

# The experimental Rust slicer (slicer-rs/, docs/proposals/rust-slicer.md): formatting, lints, tests, the native
# build, the WebAssembly build and one model sliced end to end by both, in one job. It runs only when the crate or this
# file changes: nothing else uses the crate yet, and runners are scarce (docs/ci.md).
on:
  pull_request:
    paths:
      - slicer-rs/**
      - .github/workflows/slicer-rs.yml
  push:
    branches: [main]
    paths:
      - slicer-rs/**
      - .github/workflows/slicer-rs.yml

concurrency:
  group: slicer-rs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  slicer:
    name: Rust slicer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: slicer-rs
    steps:
      - uses: actions/checkout@v4
      - name: Rust (stable, with the WebAssembly target)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            slicer-rs/target
          key: slicer-rs-${{ runner.os }}-${{ hashFiles('slicer-rs/Cargo.lock') }}
          restore-keys: slicer-rs-${{ runner.os }}-
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release
      - name: WebAssembly
        run: |
          cargo clippy --lib --target wasm32-unknown-unknown --no-default-features -- -D warnings
          cargo rustc --release --lib --crate-type cdylib --target wasm32-unknown-unknown --no-default-features
          ls -l target/wasm32-unknown-unknown/release/spaghetti_slicer.wasm
      - name: A model sliced end to end, natively and in WebAssembly, to the same file
        run: |
          cargo build --release
          ./target/release/spaghetti-slicer --timings tests/models/bridge.stl -o /tmp/bridge.gcode.3mf --stats /tmp/bridge.json
          unzip -l /tmp/bridge.gcode.3mf
          node bench/wasm-node.mjs target/wasm32-unknown-unknown/release/spaghetti_slicer.wasm /tmp/bridge-wasm.gcode.3mf tests/models/bridge.stl
          cmp /tmp/bridge.gcode.3mf /tmp/bridge-wasm.gcode.3mf
      - name: The same, with a slice setup made from the app's slicing settings
        run: |
          ./target/release/spaghetti-slicer --setup tests/setups/abs-fine-strong.json tests/models/bridge.stl -o /tmp/abs.gcode.3mf
          node bench/wasm-node.mjs target/wasm32-unknown-unknown/release/spaghetti_slicer.wasm /tmp/abs-wasm.gcode.3mf --setup tests/setups/abs-fine-strong.json tests/models/bridge.stl
          cmp /tmp/abs.gcode.3mf /tmp/abs-wasm.gcode.3mf
      - name: The same, with a brim turned on
        run: |
          echo '{"process": {"brim_type": "outer_only"}}' > /tmp/brim.json
          ./target/release/spaghetti-slicer --setup /tmp/brim.json tests/models/bridge.stl -o /tmp/brim.gcode.3mf
          node bench/wasm-node.mjs target/wasm32-unknown-unknown/release/spaghetti_slicer.wasm /tmp/brim-wasm.gcode.3mf --setup /tmp/brim.json tests/models/bridge.stl
          cmp /tmp/brim.gcode.3mf /tmp/brim-wasm.gcode.3mf
      - name: The same, a plate in two filaments over a prime tower
        run: |
          echo '{"filaments": [{}, {}], "colours": ["#F2754E", "#4F7FC7"]}' > /tmp/two.json
          ./target/release/spaghetti-slicer --setup /tmp/two.json tests/models/two-colours.3mf -o /tmp/two.gcode.3mf --gcode /tmp/two.gcode
          grep -q '; FEATURE: Prime tower' /tmp/two.gcode
          node bench/wasm-node.mjs target/wasm32-unknown-unknown/release/spaghetti_slicer.wasm /tmp/two-wasm.gcode.3mf --setup /tmp/two.json tests/models/two-colours.3mf
          cmp /tmp/two.gcode.3mf /tmp/two-wasm.gcode.3mf
          ./target/release/spaghetti-slicer --setup /tmp/two.json --filaments 1,2 tests/models/bridge.stl tests/models/bridge.stl -o /tmp/two-stl.gcode.3mf
          node bench/wasm-node.mjs target/wasm32-unknown-unknown/release/spaghetti_slicer.wasm /tmp/two-stl-wasm.gcode.3mf --setup /tmp/two.json --filaments 1,2 tests/models/bridge.stl tests/models/bridge.stl
          cmp /tmp/two-stl.gcode.3mf /tmp/two-stl-wasm.gcode.3mf
      - name: The same, with normal supports under the bridge
        run: |
          echo '{"process": {"enable_support": "1", "support_type": "normal(auto)"}}' > /tmp/supports.json
          ./target/release/spaghetti-slicer --setup /tmp/supports.json tests/models/bridge.stl -o /tmp/supports.gcode.3mf --gcode /tmp/supports.gcode
          grep -q '; FEATURE: Support interface' /tmp/supports.gcode
          node bench/wasm-node.mjs target/wasm32-unknown-unknown/release/spaghetti_slicer.wasm /tmp/supports-wasm.gcode.3mf --setup /tmp/supports.json tests/models/bridge.stl
          cmp /tmp/supports.gcode.3mf /tmp/supports-wasm.gcode.3mf
      - name: The same, with tree supports under the bridge
        run: |
          echo '{"process": {"enable_support": "1", "support_type": "tree(auto)"}}' > /tmp/trees.json
          ./target/release/spaghetti-slicer --setup /tmp/trees.json tests/models/bridge.stl -o /tmp/trees.gcode.3mf --gcode /tmp/trees.gcode
          grep -q '; FEATURE: Support$' /tmp/trees.gcode
          node bench/wasm-node.mjs target/wasm32-unknown-unknown/release/spaghetti_slicer.wasm /tmp/trees-wasm.gcode.3mf --setup /tmp/trees.json tests/models/bridge.stl
          cmp /tmp/trees.gcode.3mf /tmp/trees-wasm.gcode.3mf
      - name: The same, for the 0.2 mm nozzle (its presets as a setup in WebAssembly)
        run: |
          node -e 'const fs = require("fs"); const read = (k) => JSON.parse(fs.readFileSync(`profiles/x2d-0.2/${k}.json`, "utf8")); fs.writeFileSync("/tmp/nozzle-0.2.json", JSON.stringify({ machine: read("machine"), process: read("process"), filaments: [read("filament")] }))'
          ./target/release/spaghetti-slicer --nozzle 0.2 tests/models/bridge.stl -o /tmp/nozzle.gcode.3mf --gcode /tmp/nozzle.gcode
          grep -q '^; LINE_WIDTH: 0.244949$' /tmp/nozzle.gcode
          node bench/wasm-node.mjs target/wasm32-unknown-unknown/release/spaghetti_slicer.wasm /tmp/nozzle-wasm.gcode.3mf --setup /tmp/nozzle-0.2.json tests/models/bridge.stl
          cmp /tmp/nozzle.gcode.3mf /tmp/nozzle-wasm.gcode.3mf
      - name: The same, with a generic filament's Auto Lift (slopes, and spirals over overhangs)
        run: |
          echo '{"filaments": [{"filament_z_hop_types": ["nil", "nil", "nil", "nil"]}]}' > /tmp/lift.json
          ./target/release/spaghetti-slicer --setup /tmp/lift.json tests/models/bridge.stl -o /tmp/lift.gcode.3mf --gcode /tmp/lift.gcode
          grep -qE '^G1 X[0-9.]+ Y[0-9.]+ Z[0-9.]+ F60000$' /tmp/lift.gcode
          node bench/wasm-node.mjs target/wasm32-unknown-unknown/release/spaghetti_slicer.wasm /tmp/lift-wasm.gcode.3mf --setup /tmp/lift.json tests/models/bridge.stl
          cmp /tmp/lift.gcode.3mf /tmp/lift-wasm.gcode.3mf
