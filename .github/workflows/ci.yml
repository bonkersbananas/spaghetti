name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  # Pushes to main get their own group and are never cancelled (a queued run in a shared group would be replaced): every commit on main needs a finished run for the ship.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # The Playwright suite runs in shards, each on its own runner with its own servers. scripts/e2e-shard.ts splits
  # the spec files by measured time (e2e/timings.json: refresh with scripts/e2e-timings.ts); projects and tests are unchanged.
  e2e-shards:
    name: Playwright shard ${{ matrix.shard }}/5
    runs-on: ubuntu-latest
    # Playwright's own image has the browser and its system libraries installed, so the job never calls apt
    # (apt being unreachable took every shard down). Keep the tag on the @playwright/test version.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The files of this shard, balanced by how long they took (e2e/timings.json); only the shard with the specs
      # that need the production build builds it.
      - name: Run this shard's specs
        run: |
          set -e
          specs="$(node scripts/e2e-shard.ts ${{ matrix.shard }} 5)"
          needs_built="$(node scripts/e2e-shard.ts ${{ matrix.shard }} 5 --needs-built)"
          # No list would mean no file filter, and Playwright would run the whole suite.
          test -n "$specs"
          if [ "$needs_built" = "0" ]; then export E2E_BUILT_SERVER=off; fi
          pnpm test:e2e $specs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # One required check, whatever the number of shards: it passes when every shard did.
  e2e:
    name: Playwright smoke test
    if: always()
    needs: e2e-shards
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Shards: ${{ needs.e2e-shards.result }}"
          test "${{ needs.e2e-shards.result }}" = "success"

  docker:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t spaghetti:ci .
      - name: Run it and check the API, the SPA and persistence
        run: |
          docker run -d --name spaghetti -p 8787:8787 -v spaghetti-data:/data spaghetti:ci
          for i in $(seq 1 60); do curl -fs localhost:8787/api/health && break; sleep 1; done
          curl -fs localhost:8787/api/health
          curl -fs -H 'Sec-Fetch-Mode: navigate' localhost:8787/ideas | grep -q '<div id="root">'
          docker exec -e SPAGHETTI_PASSWORD=ci-password-123 spaghetti \
            node scripts/user-add.ts --username ci --name CI --color basil
          curl -fs -X POST localhost:8787/api/session -H 'Origin: http://localhost:8787' \
            -H 'Content-Type: application/json' -d '{"username":"ci","password":"ci-password-123"}'
          docker restart spaghetti
          for i in $(seq 1 60); do curl -fs localhost:8787/api/health && break; sleep 1; done
          curl -fs -X POST localhost:8787/api/session -H 'Origin: http://localhost:8787' \
            -H 'Content-Type: application/json' -d '{"username":"ci","password":"ci-password-123"}'
      - if: failure()
        run: docker logs spaghetti

  bridge-image:
    name: Bridge image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f bridge/Dockerfile -t spaghetti-bridge:ci .
      - name: It starts, finds ffmpeg, and says what is missing
        run: |
          docker run --rm --entrypoint ffmpeg spaghetti-bridge:ci -version | head -1
          ! docker run --rm spaghetti-bridge:ci 2>&1 | tee out.txt
          grep -q "Missing settings" out.txt
