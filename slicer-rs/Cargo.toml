[package]
name = "spaghetti-slicer"
version = "0.1.0"
edition = "2024"
description = "A fast slicer for Spaghetti: STL and plain 3MF in, a Bambu-flavoured .gcode.3mf out (an experiment, not wired into the app)."
publish = false

# The WebAssembly module is the library built as a cdylib:
# cargo rustc --release --lib --crate-type cdylib --target wasm32-unknown-unknown --no-default-features

[[bin]]
name = "spaghetti-slicer"
path = "src/main.rs"

[features]
default = ["parallel"]
# Slices layers on every core (rayon). Off for the WebAssembly build, which runs on one thread like the Orca engine.
parallel = ["dep:rayon"]

[dependencies]
boostvoronoi = "0.12.1"
crc32fast = "1.5.5"
i_overlay = "9.1.0"
md-5 = "0.11.0"
miniz_oxide = "0.9.1"
rayon = { version = "1.12.0", optional = true }

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
opt-level = 3

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = "0.3"
