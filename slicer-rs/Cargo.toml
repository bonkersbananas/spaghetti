[package]
name = "spaghetti-slicer"
version = "0.1.0"
edition = "2024"
description = "Spaghetti's own slicer: STL and 3MF in, a Bambu-flavoured .gcode.3mf out, following OrcaSlicer's algorithms. The app slices with it in the browser (WebAssembly) and falls back to OrcaSlicer's engine for what it can't slice yet."
# The AGPL-3.0, as OrcaSlicer licenses its own code (version 3 only): the crate follows its algorithms closely.
license = "AGPL-3.0-only"
publish = false

# The WebAssembly module is the library built as a cdylib:
# cargo rustc --release --lib --crate-type cdylib --target wasm32-unknown-unknown --no-default-features

[[bin]]
name = "spaghetti-slicer"
path = "src/main.rs"

[features]
default = ["parallel"]
# Slices layers on every core (rayon). Off for the WebAssembly build, which runs on one thread like the Orca engine.
parallel = ["dep:rayon"]

[dependencies]
boostvoronoi = "0.12.1"
crc32fast = "1.5.5"
i_overlay = "9.1.0"
# Maths functions in plain Rust (musl's), which WebAssembly's standard library uses too: natively it calls the
# system's, whose sines and cosines now and then differ from them in the last bit, and the file with them.
libm = "0.2.16"
md-5 = "0.11.0"
miniz_oxide = "0.9.1"
rayon = { version = "1.12.0", optional = true }

# boostvoronoi's skip list, with levels from a fixed sequence instead of a random one, so the same input gives the same
# diagram (vendor/cpp_map/Cargo.toml).
[patch.crates-io]
cpp_map = { path = "vendor/cpp_map" }

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
opt-level = 3

