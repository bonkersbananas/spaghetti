<!doctype html>
<meta charset="utf-8" />
<title>Slicer benchmark</title>
<script type="module">
  // Runs the WebAssembly slicer on the page's main thread, as the benchmark asks: window.runSlice(paths, keep, setup),
  // with the slice setup at `setup` when given; or window.runReplay(calls), the calls capture.mts recorded (their bytes
  // at /replay/<file>), which also says the file's SHA-256.
  let instance;
  async function load() {
    if (instance) return 0;
    const t0 = performance.now();
    ({ instance } = await WebAssembly.instantiateStreaming(fetch("/wasm/spaghetti_slicer.wasm"), {
      env: { now_ms: () => performance.now() },
    }));
    return performance.now() - t0;
  }
  window.runSlice = async (paths, keep, setupPath) => {
    const instantiateMs = await load();
    const e = instance.exports;
    const files = await Promise.all(
      paths.map(async (p) => ({
        name: new TextEncoder().encode(p.split("/").pop()),
        data: new Uint8Array(await (await fetch(p)).arrayBuffer()),
      })),
    );
    const setup = setupPath ? new Uint8Array(await (await fetch(setupPath)).arrayBuffer()) : null;
    const t1 = performance.now();
    let code = 0;
    if (setup) {
      const at = e.alloc(setup.length);
      new Uint8Array(e.memory.buffer, at, setup.length).set(setup);
      code = e.setup(at, setup.length);
      e.dealloc(at, setup.length);
    }
    // One file at a time: its name and bytes into WebAssembly memory, read onto the plate, freed.
    for (const f of code === 0 ? files : []) {
      const name = e.alloc(f.name.length);
      new Uint8Array(e.memory.buffer, name, f.name.length).set(f.name);
      const data = e.alloc(f.data.length);
      new Uint8Array(e.memory.buffer, data, f.data.length).set(f.data);
      code = e.add(name, f.name.length, data, f.data.length);
      e.dealloc(name, f.name.length);
      e.dealloc(data, f.data.length);
      if (code !== 0) break;
    }
    if (code === 0) code = e.slice(keep ? 1 : 0);
    const sliceMs = performance.now() - t1;
    if (code !== 0) {
      e.clear();
      return { error: code };
    }
    const memory = e.memory.buffer;
    const summary = JSON.parse(new TextDecoder().decode(new Uint8Array(memory, e.summary_ptr(), e.summary_len())));
    const fileBytes = e.output_len();
    e.clear();
    return {
      instantiateMs,
      sliceMs,
      wasmMemoryMB: Math.round(memory.byteLength / 1048576),
      fileBytes,
      timings: summary.timings,
      stats: summary.stats.summary,
    };
  };
  window.runReplay = async (calls) => {
    const instantiateMs = await load();
    const e = instance.exports;
    // The calls' bytes, fetched ahead so that fetching isn't timed.
    const encoder = new TextEncoder();
    const ready = await Promise.all(
      calls.map(async (call) => ({
        ...call,
        bytes: call.file ? new Uint8Array(await (await fetch(`/replay/${call.file}`)).arrayBuffer()) : null,
        name: call.name === undefined ? null : encoder.encode(call.name),
      })),
    );
    const withBytes = (bytes, use) => {
      const at = e.alloc(bytes.length);
      new Uint8Array(e.memory.buffer, at, bytes.length).set(bytes);
      try {
        return use(at);
      } finally {
        e.dealloc(at, bytes.length);
      }
    };
    const t1 = performance.now();
    let code = 0;
    let flags = 0;
    for (const call of ready) {
      if (call.op === "slice") flags = call.flags;
      else if (call.op === "setup") code = withBytes(call.bytes, (at) => e.setup(at, call.bytes.length));
      else if (call.op === "paint" || call.op === "paint_supports") {
        code = withBytes(call.bytes, (at) => e[call.op](at, call.bytes.length));
      } else {
        code = withBytes(call.name, (n) =>
          withBytes(call.bytes, (d) =>
            call.op === "add"
              ? e.add(n, call.name.length, d, call.bytes.length)
              : call.op === "add_in"
                ? e.add_in(n, call.name.length, d, call.bytes.length, call.filament)
                : e.add_part(n, call.name.length, d, call.bytes.length, call.filament, call.first),
          ),
        );
      }
      if (code !== 0) break;
    }
    // Dropped as the calls are: only the module holds the plate while it slices.
    ready.length = 0;
    if (code === 0) code = e.slice(flags);
    const sliceMs = performance.now() - t1;
    if (code !== 0) {
      e.clear();
      return { error: code };
    }
    const memory = e.memory.buffer;
    const summary = JSON.parse(new TextDecoder().decode(new Uint8Array(memory, e.summary_ptr(), e.summary_len())));
    const file = new Uint8Array(memory, e.output_ptr(), e.output_len()).slice();
    const sha256 = [...new Uint8Array(await crypto.subtle.digest("SHA-256", file))]
      .map((b) => b.toString(16).padStart(2, "0"))
      .join("");
    e.clear();
    return {
      instantiateMs,
      sliceMs,
      wasmMemoryMB: Math.round(memory.byteLength / 1048576),
      fileBytes: file.length,
      sha256,
      timings: summary.timings,
      stats: summary.stats.summary,
    };
  };
</script>
