<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200">
<!-- A spool lying on a wooden shelf, seen from above, its label up. FIL/FIL_DARK are filled in by the seed. -->
<defs>
<linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d2ab7e"/><stop offset="1" stop-color="#a77e52"/></linearGradient>
<filter id="woodgrain" x="0" y="0" width="1" height="1"><feTurbulence type="fractalNoise" baseFrequency=".004 .09" numOctaves="3" seed="7"/><feColorMatrix values="0 0 0 0 .35  0 0 0 0 .2  0 0 0 0 .08  0 0 0 -1.4 .85"/><feComposite in2="SourceAlpha" operator="in"/></filter>
<filter id="b20" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="20"/></filter>
<filter id="grain" x="0" y="0" width="1" height="1"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="3"/><feColorMatrix values=".33 .33 .33 0 0  .33 .33 .33 0 0  .33 .33 .33 0 0  0 0 0 0 .06"/></filter>
<radialGradient id="fil" cx=".38" cy=".32" r=".8"><stop offset="0" stop-color="FIL_LIGHT"/><stop offset=".55" stop-color="FIL"/><stop offset="1" stop-color="FIL_DARK"/></radialGradient>
<radialGradient id="flange" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#505053"/><stop offset="1" stop-color="#18181a"/></radialGradient>
<pattern id="wound" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="4.2" fill="none" stroke="#000" stroke-opacity=".09" stroke-width="1.2"/></pattern>
<radialGradient id="light" cx=".2" cy=".08" r="1"><stop offset="0" stop-color="#fff6e2" stop-opacity=".5"/><stop offset=".6" stop-color="#fff6e2" stop-opacity="0"/></radialGradient>
<radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></radialGradient>
</defs>
<rect width="900" height="1200" fill="url(#wood)"/>
<rect width="900" height="1200" fill="#000" filter="url(#woodgrain)"/>
<ellipse cx="470" cy="640" rx="380" ry="380" fill="#000" opacity=".35" filter="url(#b20)"/>
<circle cx="450" cy="600" r="380" fill="url(#flange)"/>
<circle cx="450" cy="600" r="372" fill="none" stroke="#6a6a6e" stroke-width="3" opacity=".6"/>
<circle cx="450" cy="600" r="330" fill="url(#fil)"/>
<circle cx="450" cy="600" r="330" fill="url(#wound)"/>
<path d="M190 420 A330 330 0 0 1 560 290" stroke="#fff" stroke-opacity=".35" stroke-width="18" fill="none" stroke-linecap="round"/>
<circle cx="450" cy="600" r="150" fill="#2a2a2c"/>
<circle cx="450" cy="600" r="150" fill="none" stroke="#5a5a5e" stroke-width="4"/>
<circle cx="450" cy="600" r="62" fill="#c9b18e"/>
<circle cx="450" cy="600" r="62" fill="none" stroke="#1a1a1c" stroke-width="10"/>
<g transform="rotate(-8 450 600)">
<rect x="250" y="760" width="400" height="190" rx="16" fill="#fbfaf5"/>
<rect x="250" y="760" width="400" height="44" rx="16" fill="FIL"/>
<rect x="250" y="788" width="400" height="16" fill="FIL"/>
<rect x="276" y="828" width="190" height="26" rx="5" fill="#2b2b2b"/>
<rect x="276" y="868" width="250" height="16" rx="5" fill="#8a8a86"/>
<rect x="276" y="896" width="150" height="16" rx="5" fill="#b8b6ae"/>
<g fill="#2b2b2b"><rect x="560" y="830" width="6" height="90"/><rect x="572" y="830" width="3" height="90"/><rect x="580" y="830" width="8" height="90"/><rect x="594" y="830" width="3" height="90"/><rect x="602" y="830" width="5" height="90"/><rect x="613" y="830" width="3" height="90"/><rect x="620" y="830" width="7" height="90"/></g>
</g>
<rect width="900" height="1200" fill="url(#light)"/>
<rect width="900" height="1200" filter="url(#grain)"/>
<rect width="900" height="1200" fill="url(#vig)"/>
</svg>
